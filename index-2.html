<title>In Matcha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style id="app-style">
/* Layout: floating tins over a grainy, shifting gradient. Each product owns a palette (c1 base, c2 glow, c3 shadow, ink text); the page takes it on hover. Glass pills for chrome. */
@property --c1{syntax:'<color>';inherits:true;initial-value:#5E8A27}
@property --c2{syntax:'<color>';inherits:true;initial-value:#DCEBA8}
@property --c3{syntax:'<color>';inherits:true;initial-value:#142310}
@property --ink{syntax:'<color>';inherits:true;initial-value:#F4F8E6}
@property --gx{syntax:'<percentage>';inherits:true;initial-value:24%}
:root{
  --c1:#5E8A27;--c2:#DCEBA8;--c3:#142310;--ink:#F4F8E6;
  --glass-hi:rgba(255,255,255,.34);--glass-lo:rgba(255,255,255,.08);--glass-line:rgba(255,255,255,.42);
  --f-sans:"Archivo","Noto Sans TC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
  transition:--c1 .9s ease,--c2 .9s ease,--c3 .9s ease,--ink .9s ease;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--c1);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase}

/* Atmosphere */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(65% 85% at var(--gx) 30%,var(--c2) 0%,transparent 62%),
  radial-gradient(55% 75% at calc(100% - var(--gx)) 88%,var(--c3) 0%,transparent 66%),
  linear-gradient(118deg,var(--c1) 20%,color-mix(in srgb,var(--c1) 72%,var(--c3)));
  animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{from{--gx:16%}to{--gx:74%}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;background-image:var(--noise);opacity:.22;mix-blend-mode:overlay}
#app{position:relative;z-index:2}

/* Glass */
.glass{background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 30px -14px rgba(0,0,0,.4);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%)}
.pill{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 16px;border-radius:999px;text-decoration:none;cursor:pointer;white-space:nowrap}
.pill:hover{background:linear-gradient(180deg,rgba(255,255,255,.46),rgba(255,255,255,.14))}

/* Header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:10px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));pointer-events:none}
.hdr .grp{display:flex;gap:6px;align-items:flex-start;pointer-events:auto;min-width:0}
.hdr .grp:first-child{gap:12px}

.logo{display:block;width:3cm;height:3cm;flex:none}
.logo i{display:block;width:100%;height:100%;background:var(--ink);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;transition:transform .5s var(--ease)}
.logo:hover i{transform:rotate(-8deg) scale(1.04)}
.count{width:40px;padding:0;justify-content:center;font-family:var(--f-mono);font-size:13px}
.hdr .bare{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:none;border:0;padding:8px 4px;cursor:pointer;text-decoration:none}
.hdr .bare[aria-pressed="false"]{opacity:.55}
@media (max-width:560px){.hide-sm{display:none!important}}

/* Home field */
.field{position:relative;width:100%}
.item{position:absolute;width:var(--w);text-decoration:none;display:block;animation:rise 1s var(--ease) both;animation-delay:var(--d)}
.item .bob{animation:bob 7s ease-in-out infinite;animation-delay:var(--b)}
.item figure{margin:0;transition:transform .6s var(--ease)}
.item:hover figure,.item:focus-visible figure,.item.on figure{transform:scale(1.08) rotate(-4deg)}
.item:focus-visible{outline:none}
.item:focus-visible figure{outline:2px solid var(--ink);outline-offset:8px;border-radius:12px}
.item img{width:100%;display:block;filter:drop-shadow(0 24px 22px rgba(0,0,0,.3))}
.item .lbl{position:absolute;left:50%;top:100%;transform:translate(-50%,10px);white-space:nowrap;opacity:0;transition:opacity .3s,transform .4s var(--ease);pointer-events:none}
.item:hover .lbl,.item:focus-visible .lbl,.item.on .lbl{opacity:1;transform:translate(-50%,4px)}
.item.sold figure{opacity:.6}
.item .soldtag{position:absolute;left:50%;top:-10px;transform:translateX(-50%);white-space:nowrap}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-12px) rotate(calc(var(--r) * -1))}}

/* Placeholder product art (until photos are uploaded) */
.ph-tin{position:relative;width:100%;aspect-ratio:3/4;border-radius:18px 18px 14px 14px;margin-top:9%;
  background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(255,255,255,.28) 28%,rgba(255,255,255,0) 52%,rgba(0,0,0,.24)),var(--t);
  filter:drop-shadow(0 24px 22px rgba(0,0,0,.3))}
.ph-tin::before{content:"";position:absolute;left:-5%;right:-5%;top:-9%;height:17%;border-radius:12px;
  background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(255,255,255,.34) 32%,rgba(0,0,0,.16)),var(--l)}
.ph-tin .tg{position:absolute;left:13%;right:13%;top:34%;bottom:16%;border-radius:6px;background:color-mix(in srgb,var(--l) 30%,#fbfcf3);color:var(--t);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:6px;overflow:hidden}
.ph-tin .tg i{font-style:normal;font-family:var(--f-mono);font-size:max(7px,.55em);letter-spacing:.18em}
.ph-tin .tg b{font-weight:800;font-stretch:112%;font-size:1.05em;line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.ph-bowl{position:relative;width:100%;aspect-ratio:1.5;margin-top:30%;filter:drop-shadow(0 24px 22px rgba(0,0,0,.3))}
.ph-bowl::before{content:"";position:absolute;left:0;right:0;top:0;height:36%;border-radius:50%;
  background:radial-gradient(ellipse at 45% 45%,#E7F0B4 0 12%,#9CBF3E 40%,#5E8A27 70%),#5E8A27;box-shadow:inset 0 0 0 5px var(--l);z-index:1}
.ph-bowl::after{content:"";position:absolute;left:0;right:0;top:18%;bottom:0;border-radius:0 0 48% 48%/0 0 70% 70%;
  background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(255,255,255,.25) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.28)),var(--t)}

/* Caption */
.caption{position:fixed;z-index:30;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:min(380px,calc(100% - 40px));padding:16px 18px;border-radius:18px;display:flex;flex-direction:column;gap:8px}
.caption .big{font-weight:700;font-stretch:118%;font-size:20px;line-height:1.15;text-transform:uppercase;text-wrap:balance}
.caption p{margin:0}
.caption .small{font-size:14px;opacity:.85}
.caption .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.caption a.mono{text-decoration:none;padding:6px 10px;border-radius:999px;border:1px solid var(--glass-line)}
.caption a.mono:hover{background:rgba(255,255,255,.18)}
@media (max-width:700px){.caption{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px))}}

/* Product view */
.pv{position:fixed;inset:0;display:grid;place-items:center}
.stage{width:min(56vw,640px);aspect-ratio:1;max-width:100%;display:grid;place-items:center;perspective:1100px;cursor:grab;touch-action:pan-y;user-select:none}
.stage:active{cursor:grabbing}

function cartCount(){ return cartLines().reduce(function(a, l){ return a + (l.p.soldOut ? 0 : l.qty); }, 0); }
function totals(){
  var s = data().settings, lines = cartLines().filter(function(l){ return !l.p.soldOut; });
  var sub = lines.reduce(function(a, l){ return a + l.qty * (Number(l.p.price) || 0); }, 0);
  var fee = Math.max(0, Number(s.shipFee) || 0), over = Math.max(0, Number(s.freeShipOver) || 0);

function processImage(file){
